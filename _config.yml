# Welcome to Jekyll!
#
# This file contains configuration options for your Jekyll site.
# For more details, see: https://jekyllrb.com/docs/configuration/

# Site settings
title: "Bingbing Wang"
tagline: "Associate Professor, Zhengzhou University"
description: >-
  Personal academic homepage of Bingbing Wang, associate professor at
  School of Computer Science and Artificial Intelligence, Zhengzhou University.
  Research interests include wireless sensing, ultra-low power wireless
  communication, and integrated sensing and communication.
author: Bingbing Wang
email: wangbingbing@zzu.edu.cn

# URL settings — for a user-site (<username>.github.io), baseurl MUST stay empty.
url: "https://bingwl.github.io"
baseurl: ""

# Multi-language settings
# `default_lang` is the language of the root homepage.
# The Chinese version is served at /zh/ and the English version at /.
languages: ["en", "zh"]
default_lang: "en"
lang_names:
  en: "English"
  zh: "中文"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
paginate: 5
paginate_path: "/page:num/"

# Plugins (use only those supported by GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Collections
collections:
  publications:
    output: true
    permalink: /publications/:path/

# Defaults so front-matter is not required for posts/pages
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Sass settings
sass:
  style: compressed
